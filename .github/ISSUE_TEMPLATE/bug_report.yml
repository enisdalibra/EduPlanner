name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach real student data, backups, rosters, browser profiles, or sensitive logs. Report vulnerabilities through the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use records such as Siswa Contoh 01, DEMO-0001, and Kelas Demo A.
      placeholder: |
        1. Create Kelas Demo A
        2. Add Siswa Contoh 01 with NIS DEMO-0001
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA, without a private deployment URL.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 128 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network state
      options:
        - Online
        - Offline
        - Both
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional privacy-safe context
      description: Do not paste secrets, personal data, real records, or logs that contain them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only manually created synthetic data and removed personal data, credentials, private URLs, and local profile details.
          required: true
        - label: This report is not an undisclosed security vulnerability.
          required: true
