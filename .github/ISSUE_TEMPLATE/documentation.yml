name: Documentation issue
description: Report unclear, inaccurate, or missing documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide a repository path or public documentation URL.
      placeholder: docs/backup-and-restore.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: Any examples use only synthetic data such as Siswa Contoh 01, DEMO-0001, and Kelas Demo A.
          required: true
